services:
  broker:
    build:
      context: .
      dockerfile: Dockerfile.broker
    ports:
      - "5555:5555"
    restart: unless-stopped

  pubsub-proxy:
    build:
      context: .
      dockerfile: Dockerfile.pubsub
    ports:
      - "5557:5557"
      - "5558:5558"
    restart: unless-stopped

  reference:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["python", "-u", "reference.py"]
    environment:
      REFERENCE_ENDPOINT: tcp://*:5559
      SERVER_IDS: server-1,server-2,java-server-1,java-server-2,cpp-server-1,cpp-server-2
      HEARTBEAT_TIMEOUT_SECONDS: "60"
    restart: unless-stopped

  server-1:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["python", "-u", "-m", "server.server"]
    environment:
      SERVER_ID: server-1
      BROKER_BACKEND: tcp://broker:5556
      DATABASE_PATH: /data/server.sqlite3
      PUBSUB_XSUB: tcp://pubsub-proxy:5557
      REFERENCE_ENDPOINT: tcp://reference:5559
      SERVER_CONTROL_TIMEOUT_MS: "3000"
      SERVER_IDS: server-1,server-2,java-server-1,java-server-2,cpp-server-1,cpp-server-2
    volumes:
      - server-1-data:/data
    depends_on:
      - broker
      - pubsub-proxy
      - reference
    restart: unless-stopped

  server-2:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["python", "-u", "-m", "server.server"]
    environment:
      SERVER_ID: server-2
      BROKER_BACKEND: tcp://broker:5556
      DATABASE_PATH: /data/server.sqlite3
      PUBSUB_XSUB: tcp://pubsub-proxy:5557
      REFERENCE_ENDPOINT: tcp://reference:5559
      SERVER_CONTROL_TIMEOUT_MS: "3000"
      SERVER_IDS: server-1,server-2,java-server-1,java-server-2,cpp-server-1,cpp-server-2
    volumes:
      - server-2-data:/data
    depends_on:
      - broker
      - pubsub-proxy
      - reference
    restart: unless-stopped

  java-server-1:
    build:
      context: .
      dockerfile: Dockerfile.java
    environment:
      SERVER_ID: java-server-1
      BROKER_BACKEND: tcp://broker:5556
      DATABASE_PATH: /data/java-server-1.sqlite3
      PUBSUB_XSUB: tcp://pubsub-proxy:5557
      PUBSUB_XPUB: tcp://pubsub-proxy:5558
      REFERENCE_ENDPOINT: tcp://reference:5559
      SERVER_IDS: server-1,server-2,java-server-1,java-server-2,cpp-server-1,cpp-server-2
    volumes:
      - java-server-1-data:/data
    depends_on: [broker, pubsub-proxy, reference]
    restart: unless-stopped

  java-server-2:
    build:
      context: .
      dockerfile: Dockerfile.java
    environment:
      SERVER_ID: java-server-2
      BROKER_BACKEND: tcp://broker:5556
      DATABASE_PATH: /data/java-server-2.sqlite3
      PUBSUB_XSUB: tcp://pubsub-proxy:5557
      PUBSUB_XPUB: tcp://pubsub-proxy:5558
      REFERENCE_ENDPOINT: tcp://reference:5559
      SERVER_IDS: server-1,server-2,java-server-1,java-server-2,cpp-server-1,cpp-server-2
    volumes:
      - java-server-2-data:/data
    depends_on: [broker, pubsub-proxy, reference]
    restart: unless-stopped

  cpp-server-1:
    build:
      context: .
      dockerfile: Dockerfile.cpp
    environment:
      APP_MODE: server
      SERVER_ID: cpp-server-1
      BROKER_BACKEND: tcp://broker:5556
      DATABASE_PATH: /data/cpp-server-1.sqlite3
      PUBSUB_XSUB: tcp://pubsub-proxy:5557
      PUBSUB_XPUB: tcp://pubsub-proxy:5558
      REFERENCE_ENDPOINT: tcp://reference:5559
      SERVER_IDS: server-1,server-2,java-server-1,java-server-2,cpp-server-1,cpp-server-2
    volumes:
      - cpp-server-1-data:/data
    depends_on: [broker, pubsub-proxy, reference]
    restart: unless-stopped

  cpp-server-2:
    build:
      context: .
      dockerfile: Dockerfile.cpp
    environment:
      APP_MODE: server
      SERVER_ID: cpp-server-2
      BROKER_BACKEND: tcp://broker:5556
      DATABASE_PATH: /data/cpp-server-2.sqlite3
      PUBSUB_XSUB: tcp://pubsub-proxy:5557
      PUBSUB_XPUB: tcp://pubsub-proxy:5558
      REFERENCE_ENDPOINT: tcp://reference:5559
      SERVER_IDS: server-1,server-2,java-server-1,java-server-2,cpp-server-1,cpp-server-2
    volumes:
      - cpp-server-2-data:/data
    depends_on: [broker, pubsub-proxy, reference]
    restart: unless-stopped

  java-bot-1:
    build:
      context: .
      dockerfile: Dockerfile.java
    environment:
      BOT_NAME: Huguinho
      BROKER_FRONTEND: tcp://broker:5555
      PUBSUB_XPUB: tcp://pubsub-proxy:5558
      REFERENCE_ENDPOINT: tcp://reference:5559
      SERVER_IDS: server-1,server-2,java-server-1,java-server-2,cpp-server-1,cpp-server-2
    command: ["java", "-cp", "app.jar", "bbs.JavaBot"]
    depends_on: [broker, pubsub-proxy, reference, server-1, server-2, java-server-1, java-server-2, cpp-server-1, cpp-server-2]
    restart: unless-stopped

  java-bot-2:
    build:
      context: .
      dockerfile: Dockerfile.java
    environment:
      BOT_NAME: Luizinho
      BROKER_FRONTEND: tcp://broker:5555
      PUBSUB_XPUB: tcp://pubsub-proxy:5558
      REFERENCE_ENDPOINT: tcp://reference:5559
      SERVER_IDS: server-1,server-2,java-server-1,java-server-2,cpp-server-1,cpp-server-2
    command: ["java", "-cp", "app.jar", "bbs.JavaBot"]
    depends_on: [broker, pubsub-proxy, reference, server-1, server-2, java-server-1, java-server-2, cpp-server-1, cpp-server-2]
    restart: unless-stopped

  cpp-bot-1:
    build:
      context: .
      dockerfile: Dockerfile.cpp
    environment:
      APP_MODE: bot
      BOT_NAME: Zequinha
      BROKER_FRONTEND: tcp://broker:5555
      PUBSUB_XPUB: tcp://pubsub-proxy:5558
      REFERENCE_ENDPOINT: tcp://reference:5559
      SERVER_IDS: server-1,server-2,java-server-1,java-server-2,cpp-server-1,cpp-server-2
    depends_on: [broker, pubsub-proxy, reference, server-1, server-2, java-server-1, java-server-2, cpp-server-1, cpp-server-2]
    restart: unless-stopped

  cpp-bot-2:
    build:
      context: .
      dockerfile: Dockerfile.cpp
    environment:
      APP_MODE: bot
      BOT_NAME: Fabinho
      BROKER_FRONTEND: tcp://broker:5555
      PUBSUB_XPUB: tcp://pubsub-proxy:5558
      REFERENCE_ENDPOINT: tcp://reference:5559
      SERVER_IDS: server-1,server-2,java-server-1,java-server-2,cpp-server-1,cpp-server-2
    depends_on: [broker, pubsub-proxy, reference, server-1, server-2, java-server-1, java-server-2, cpp-server-1, cpp-server-2]
    restart: unless-stopped

  bot-1:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["python", "-u", "client/bot.py"]
    environment:
      BOT_NAME: Mariazinha
      CHANNEL_NAME: geral
      BROKER_FRONTEND: tcp://broker:5555
      PUBSUB_XPUB: tcp://pubsub-proxy:5558
      REFERENCE_ENDPOINT: tcp://reference:5559
      SERVER_IDS: server-1,server-2,java-server-1,java-server-2,cpp-server-1,cpp-server-2
      REQUEST_TIMEOUT_MS: "1500"
    depends_on: [broker, pubsub-proxy, reference, server-1, server-2, java-server-1, java-server-2, cpp-server-1, cpp-server-2]
    restart: unless-stopped

  bot-2:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["python", "-u", "client/bot.py"]
    environment:
      BOT_NAME: Zezinho
      CHANNEL_NAME: geral
      BROKER_FRONTEND: tcp://broker:5555
      PUBSUB_XPUB: tcp://pubsub-proxy:5558
      REFERENCE_ENDPOINT: tcp://reference:5559
      SERVER_IDS: server-1,server-2,java-server-1,java-server-2,cpp-server-1,cpp-server-2
      REQUEST_TIMEOUT_MS: "1500"
    depends_on: [broker, pubsub-proxy, reference, server-1, server-2, java-server-1, java-server-2, cpp-server-1, cpp-server-2]
    restart: unless-stopped

volumes:
  server-1-data:
  server-2-data:
  java-server-1-data:
  java-server-2-data:
  cpp-server-1-data:
  cpp-server-2-data:

networks:
  default:
    name: projeto-bbs-network
