syntax = "proto3";
package bbs;

message Envelope { int64 sent_at_unix_ms = 1; string message_id = 2; uint64 logical_clock = 3; oneof payload { LoginRequest login_request = 10; LoginResponse login_response = 11; ListChannelsRequest list_channels_request = 12; ListChannelsResponse list_channels_response = 13; CreateChannelRequest create_channel_request = 14; CreateChannelResponse create_channel_response = 15; PublishRequest publish_request = 17; PublishResponse publish_response = 18; Publication publication = 19; ErrorResponse error_response = 16; HistoryRequest history_request = 20; HistoryResponse history_response = 21; } }
message LoginRequest { string username = 1; }
message LoginResponse { bool accepted = 1; string error_code = 2; string detail = 3; }
message ListChannelsRequest {}
message ListChannelsResponse { repeated string channel_names = 1; }
message CreateChannelRequest { string name = 1; }
message CreateChannelResponse { bool created = 1; string error_code = 2; string detail = 3; }
message PublishRequest { string channel_name = 1; string content = 2; }
message PublishResponse { bool published = 1; string error_code = 2; string detail = 3; }
message Publication { string channel_name = 1; string content = 2; string username = 3; int64 sent_at_unix_ms = 4; }
message HistoryRequest { string channel_name = 1; }
message HistoryResponse { repeated Publication publications = 1; }
message ErrorResponse { string error_code = 1; string detail = 2; }
message ControlEnvelope { int64 sent_at_unix_ms = 1; string message_id = 2; uint64 logical_clock = 3; oneof payload { ReferenceRequest reference_request = 10; ReferenceResponse reference_response = 11; PeerRequest peer_request = 12; PeerResponse peer_response = 13; CoordinatorAnnouncement coordinator_announcement = 14; } }
message ServerInfo { string name = 1; uint32 rank = 2; }
message ReferenceRequest { string action = 1; string name = 2; uint32 rank = 3; }
message ReferenceResponse { bool ok = 1; string detail = 2; uint32 rank = 3; repeated ServerInfo servers = 4; }
message ReplicationEvent { string event_id = 1; string event_type = 2; string origin = 3; string username = 4; string channel_name = 5; string content = 6; string message_id = 7; string direction = 8; string message_type = 9; string created_by = 10; string created_by_origin = 11; int64 sent_at_unix_ms = 12; int64 received_at_unix_ms = 13; int64 created_at_unix_ms = 14; }
message PeerRequest { string action = 1; string coordinator = 2; string server_name = 3; int64 server_time_unix_ms = 4; repeated ReplicationEvent events = 5; uint64 after_sequence = 6; }
message PeerResponse { bool ok = 1; string detail = 2; string server_name = 3; uint32 rank = 4; int64 server_time_unix_ms = 5; int64 correct_time_unix_ms = 6; repeated ReplicationEvent events = 7; repeated string applied_event_ids = 8; uint64 next_sequence = 9; }
message CoordinatorAnnouncement { string coordinator = 1; }
